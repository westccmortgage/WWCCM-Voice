# Render Blueprint for WWCCM-Voice.
#
# A Web Service (public URL + persistent WebSocket) is required — Twilio must
# reach POST /voice and open a Media Stream WebSocket to /media. Use an ALWAYS-ON
# plan (starter), NOT free: a free instance sleeps and wakes in 30–50s, which is
# fatal for a phone call. Secrets are set in the Render dashboard (sync: false).

services:
  - type: web
    name: wwccm-voice
    runtime: node
    plan: starter            # always-on; do NOT use "free" for telephony
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node src/server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VOICE_RUNTIME_ENABLED
        value: false         # explicit activation gate
      - key: VOICE_ADMISSION_MODE
        value: disabled      # test/production require separate release approval
      - key: VOICE_TEST_ALLOWED_CALLER
        sync: false          # exact owner E.164 only for an approved test
      - key: VOICE_ADMISSION_URL
        sync: false          # https://walletwccm.com/api/voice-admission
      # --- the advisor brain (Wallet WCCM site) ---
      - key: VOICE_TURN_URL
        sync: false          # https://walletwccm.com/api/voice-advisor-turn
      - key: VOICE_SHARED_SECRET
        sync: false          # must match the same var on the Netlify site
      - key: AGENT_LANGUAGE
        value: en            # en | ru | es | zh

      # --- speech to text (Deepgram) ---
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_MODEL
        value: nova-2
      - key: DEEPGRAM_LANGUAGE
        value: en

      # --- text to speech (ElevenLabs) ---
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_turbo_v2_5

      # --- Emma on Twilio ConversationRelay (off unless VOICE_TRANSPORT=relay) ---
      - key: VOICE_TRANSPORT
        value: media-stream  # relay = ConversationRelay TwiML + /relay socket
      - key: VOICE_RELAY_URL
        sync: false          # https://<project>.supabase.co/functions/v1/core-v2-voice-relay
      - key: VOICE_RELAY_KEY_ID
        sync: false          # must match CORE_V2_RELAY_KEY_ID in Core
      - key: VOICE_RELAY_HMAC_SECRET
        sync: false          # shared only with the core-v2-voice-relay function
      - key: TWILIO_ACCOUNT_SID
        sync: false          # optional: pins the ConversationRelay setup account

      # --- required: fail-closed verification for HTTP and WebSocket traffic ---
      - key: TWILIO_AUTH_TOKEN
        sync: false

      # --- hard per-call usage ceilings (tighten for acceptance) ---
      - key: MAX_CALL_SECONDS
        value: 1800
      - key: MAX_CONVERSATION_TURNS
        value: 60
      - key: MAX_TTS_CHARACTERS
        value: 25000
